worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream frontend_app {
        server frontend:80; 
    }

    upstream backend_core_api {
        server backend-core:3000;
    }

    server {
        listen 80;
        server_name _; 

        # Lempar ke Frontend React
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Lempar ke Backend Modular Monolith
        location /api/v1/ {
            proxy_pass http://backend_core_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}